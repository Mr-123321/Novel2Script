version: '3.8'

# ============================================================
# Novel2Script — Docker Compose Infrastructure
# ============================================================
# Services: MySQL 8.0, Redis 7, Milvus Standalone + etcd,
#           Backend (Spring Boot), Frontend (Next.js)
# ============================================================

services:

  # ==========================================
  # MySQL 8.0 — Primary relational database
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: n2s-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-novel2script}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel2script}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-novel2script}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - n2s-network

  # ==========================================
  # Redis 7 — Cache & session store
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: n2s-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n2s-network

  # ==========================================
  # etcd — Metadata store for Milvus
  # ==========================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: n2s-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - n2s-network

  # ==========================================
  # Milvus Standalone — Vector database
  # ==========================================
  milvus-standalone:
    image: milvusdb/milvus:v2.4.8
    container_name: n2s-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    networks:
      - n2s-network

  # ==========================================
  # MinIO — Object storage for Milvus
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: n2s-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - n2s-network

  # ==========================================
  # Backend — Spring Boot 3.5 on Java 21
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: n2s-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-novel2script}
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - AI_MODEL=${AI_MODEL:-deepseek-chat}
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
    depends_on:
      mysql:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - n2s-network

  # ==========================================
  # Frontend — Next.js 15
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: n2s-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - n2s-network

# ============================================================
# Named Volumes
# ============================================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  etcd-data:
    driver: local
  milvus-data:
    driver: local
  minio-data:
    driver: local

# ============================================================
# Network
# ============================================================
networks:
  n2s-network:
    driver: bridge
    name: n2s-network
