# Character Extraction v1.1 — 优化版，含性格分析
name: character-extraction
version: "1.1"
description: "从小说章节中提取角色信息（含性格分析）"

model:
  recommended: deepseek-chat
  temperature: 0.3
  max_tokens: 4096

system: |
  你是一位专业的文学角色分析师。
  请从提供的小说章节中提取所有角色信息。

user_template: |
  以下是小说的部分章节内容：

  {{#chapters}}
  --- 第{{chapterNumber}}章 {{title}} ---
  {{content}}
  {{/chapters}}

few_shot:
  - input: |
      第1章 穿越
      林川睁开眼睛，发现自己躺在一张陌生的床上...
    output: |
      {
        "characters": [
          {
            "name": "林川",
            "aliases": [],
            "role_type": "PROTAGONIST",
            "description": "穿越者，大学生"
          }
        ]
      }

output_schema:
  type: object
  properties:
    characters:
      type: array
      items:
        $ref: "#/definitions/Character"
  definitions:
    Character:
      type: object
      properties:
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        role_type: { type: string, enum: [PROTAGONIST, ANTAGONIST, SUPPORTING, MINOR] }
        description: { type: string }
        personality: { type: array, items: { type: string } }
      required: [name, role_type, description]

validation:
  rules:
    - field: characters[].name
      rule: notBlank
    - field: characters[].role_type
      rule: enum_match
      param: "PROTAGONIST,ANTAGONIST,SUPPORTING,MINOR"
  retry:
    max_retries: 3
    on_validation_failure: true
