# Character Extraction v2.0 — 含性格分析与关系推理
name: character-extraction
version: "2.0"
description: "从小说章节中提取角色信息，包含性格分析和关系推理"

model:
  recommended: claude-sonnet-4-6
  temperature: 0.3
  max_tokens: 4096
  response_format: json_object

system: |
  你是一位专业的文学角色分析师。
  请从提供的小说章节中提取所有角色，并为每个角色进行性格分析和关系推理。

  ## 角色类型（role_type）判定标准

  | 类型 | 判定标准 | 示例 |
  |------|---------|------|
  | **PROTAGONIST** | 故事的核心主角，视角跟随的主要人物 | 林川、萧炎 |
  | **DEUTERAGONIST** | 与主角关系密切的重要配角，通常是盟友、导师、恋人或亦敌亦友的关键人物 | 萧薰儿（盟友/恋人）、药老（导师） |
  | **ANTAGONIST** | 直接与主角对立的角色，制造主要冲突 | 反派掌门、敌对势力首领 |
  | **SUPPORTING** | 对剧情有贡献但不属于核心阵营的配角 | 同门师兄弟、路人侠客 |
  | **MINOR** | 仅出场1-2次的龙套角色或功能性路人 | 店小二、守门弟子 |

  ⚠️ 角色类型判定优先级：
  1. 如果角色与主角站在对立面 → ANTAGONIST
  2. 如果角色与主角有密切互动（盟友、恋人、导师、挚友）且非对立 → DEUTERAGONIST
  3. 如果角色就是主角本人 → PROTAGONIST
  4. 如果角色是独立的次要角色 → SUPPORTING
  5. 仅出场极少的龙套 → MINOR

  分析要点：
  - 识别角色的性格特征（勇气、智慧、野心、善良等）
  - **必须推断角色之间的关系**（朋友、敌人、家人、恋人、师徒等），即使小说未明确写出，也要根据角色互动推断
  - 判断角色类型（主角、反派、配角、次要角色）
  - **必须统计每个角色的出场次数（appearance_count）**：统计该角色在章节中出现的次数（包括提及姓名、别名、对话等），至少为1
  - **必须推断角色的性别（gender）**：根据名字、称呼（他/她）、描述等推断，值为"MALE"（男）、"FEMALE"（女）或"UNKNOWN"（未知）
  - 关系字段不要留空！对每个主要角色至少列出1-2个关系
  - **注意区分角色与场景描述**：角色的名字不会包含动作词（如"垂落""颤动""转身"），也不会是身体部位（如"睫毛""手指"）

  ⚠️ 关键约束 — 只提取真实的人物角色名称：
  - 角色名称必须是名词性的人名、称号或昵称（如"林川""幽冥老人""药老"）
  - **严禁**提取以下内容作为角色名：
    · 情绪或状态描述（如"平静""愤怒""高兴"）
    · 动作描写（如"到来""离开""转身""说道"）
    · 叙述性短语（如"一个人""众人""年轻人"）
    · 包含标点符号的文本片段（如"到来，平静应"）
    · 对话引导词（如"平静道""笑着说""问道"）
    · 身体部位+动作组合（如"睫毛颤动""手指轻弹"）
  - 中文人名通常为2-4个汉字，5字及以上的"名字"要格外谨慎
  - **宁缺毋滥**：如果一段文本读起来不像是人的名字，就不要提取

user_template: |
  以下是小说的部分章节内容：

  {{#chapters}}
  --- 第{{chapterNumber}}章 {{title}} ---
  {{content}}
  {{/chapters}}

  {{#focusCharacters}}
  请特别关注以下角色：{{focusCharacters}}
  {{/focusCharacters}}

few_shot:
  - input: |
      第1章 穿越
      林川睁开眼睛，发现自己躺在一张陌生的床上。他记得自己昨晚还在图书馆准备考试。门外传来脚步声，他的室友老王推门进来："你小子终于醒了！"林川还没来得及回答，手机响了——是他暗恋已久的学妹苏晴。
    output: |
      {
        "characters": [
          {
            "name": "林川",
            "aliases": ["川哥"],
            "role_type": "PROTAGONIST",
            "gender": "MALE",
            "age_range": "20-25",
            "personality": ["好奇心强", "适应力强", "理性"],
            "description": "大学生，意外穿越到异世界，拥有现代知识",
            "appearance_count": 1,
            "first_appearance_chapter": "第1章 穿越",
            "relationships": [
              {"target": "老王", "relation": "室友"},
              {"target": "苏晴", "relation": "暗恋对象"}
            ]
          },
          {
            "name": "老王",
            "aliases": [],
            "role_type": "SUPPORTING",
            "gender": "MALE",
            "age_range": "22-25",
            "personality": ["热情", "大大咧咧"],
            "description": "林川的大学室友，性格开朗",
            "appearance_count": 1,
            "first_appearance_chapter": "第1章 穿越",
            "relationships": [
              {"target": "林川", "relation": "室友"}
            ]
          },
          {
            "name": "苏晴",
            "aliases": [],
            "role_type": "SUPPORTING",
            "gender": "FEMALE",
            "age_range": "20-23",
            "personality": ["温柔", "善良", "内向"],
            "description": "林川的学妹，成绩优秀",
            "appearance_count": 1,
            "first_appearance_chapter": "第1章 穿越",
            "relationships": [
              {"target": "林川", "relation": "学长"}
            ]
          }
        ]
      }

output_schema:
  type: object
  properties:
    characters:
      type: array
      items:
        $ref: "#/definitions/Character"
  definitions:
    Character:
      type: object
      properties:
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        role_type: { type: string, enum: [PROTAGONIST, DEUTERAGONIST, ANTAGONIST, SUPPORTING, MINOR] }
        gender: { type: string, enum: [MALE, FEMALE, UNKNOWN] }
        age_range: { type: string }
        personality: { type: array, items: { type: string } }
        description: { type: string }
        appearance_count: { type: integer, minimum: 1 }
        first_appearance_chapter: { type: string }
        relationships:
          type: array
          items:
            type: object
            properties:
              target: { type: string }
              relation: { type: string }
      required: [name, role_type, description, gender, appearance_count]

validation:
  rules:
    - field: characters[].name
      rule: notBlank
    - field: characters[].role_type
      rule: enum_match
      param: "PROTAGONIST,DEUTERAGONIST,ANTAGONIST,SUPPORTING,MINOR"
  retry:
    max_retries: 3
    on_validation_failure: true
