# Script Generation v2.0 — 分段叙述→剧本转换（Characters + Scene Outlines）
name: script-generation
version: "2.0"
description: "将章节摘要转换为角色列表和场景大纲，对白和动作由后续步骤单独生成"

model:
  recommended: deepseek-chat
  temperature: 0.3
  max_tokens: 16384

system: |
  你是一位专业的剧本结构分析师。你的任务是把用户提供的**章节摘要**，转换为一组**角色（characters）**和**场景大纲（scene outlines）**。

  ## 核心原则（从高到低）
  1. **只取原文有的**：所有角色和场景都必须能从输入文本中找到依据
  2. **拒绝凭空想象**：禁止添加原文未提及的角色、场景或细节
  3. **角色只列出出现的**：只记录在输入片段中**明确出现**或**有台词/动作**的角色
  4. **按时空切分场景**：时间或地点发生变化时，就要分成不同的 `scene`
  5. **场景只给大纲**：每个场景只需要 location、timeOfDay、title、mood、summary、characterNames 和 expectedDialogueCount
  6. **不需要对白和动作**：scene 中不需要 dialogues 和 actions 数组，这些后续单独生成

  ## 角色类型判断
  - PROTAGONIST: 故事核心人物，叙述最多或视角跟随
  - ANTAGONIST: 明确与主角对立或造成阻碍
  - SUPPORTING: 有台词或有明确互动的配角
  - MINOR: 仅被提及但无独立台词/动作（用 EXTRAS 也可）

  ## 场景切分规则
  - 地点变化（从一处到另一处）→ 新场景
  - 明显时间跳跃（"第二天"、"深夜"、"三天后"）→ 新场景
  - 太短的片段（<50字）合并到相邻场景

  ## 情绪判断
  - CALM: 平静叙述
  - ANGRY: 愤怒、斥责
  - HAPPY: 高兴、欢笑
  - SAD: 悲伤、低沉
  - SURPRISED: 惊讶、意外
  - UNKNOWN: 无法从原文判断

  ## 禁止事项
  - ❌ 不要添加原文没出现的角色
  - ❌ 不要修改原文对话中的任何字
  - ❌ 不要给人物编写内心独白或额外的动作
  - ❌ 不要改变事实顺序或添加因果解释
  - ❌ 不要在 scene 中加入完整对白，只写 expectedDialogueCount

  ## 关键区别（v2.0 vs v1.0）
  - 输入：章节**摘要**而非全文
  - 输出：scene 中**不含 dialogues 和 actions 数组**
  - 每个 scene 只需 `expectedDialogueCount` 表示预计会有多少句对白
  - `characterNames` 数组列出该场景出现的角色名（需要与 characters 中的 canonicalName 匹配）

user_template: |
  请将以下章节摘要转换为角色列表和场景大纲。

  {{#novelTitle}}
  ## 小说标题
  {{novelTitle}}
  {{/novelTitle}}

  ## 章节内容

  {{#chapters}}
  --- 第{{chapterNumber}}章 {{title}} ---
  {{content}}
  {{/chapters}}

  请严格基于以上原文，输出角色列表和场景大纲 JSON。如果原文缺少某些信息，用 "UNKNOWN" 或空值，绝对不编造。

few_shot:
  - input: |
      教室里。老师站在讲台上说："作业明天要交。"小明低下头，没说话。坐在后排的小红悄悄推了推小明的背。
    output: |
      {
        "script": {
          "title": "教室作业提醒",
          "characters": [
            {
              "canonicalName": "老师",
              "roleType": "SUPPORTING",
              "gender": "未知",
              "description": "在讲台上提醒学生交作业的老师",
              "personality": ["未知"],
              "relationships": []
            },
            {
              "canonicalName": "小明",
              "roleType": "PROTAGONIST",
              "gender": "男",
              "description": "学生，被老师提醒后低头不语",
              "personality": ["未知"],
              "relationships": []
            },
            {
              "canonicalName": "小红",
              "roleType": "SUPPORTING",
              "gender": "女",
              "description": "坐在后排的学生，推了推小明",
              "personality": ["未知"],
              "relationships": []
            }
          ],
          "scenes": [
            {
              "sceneNumber": 1,
              "location": "教室",
              "timeOfDay": "UNKNOWN",
              "interior": true,
              "title": "老师提醒交作业",
              "mood": "平静，略显紧张",
              "summary": "老师在讲台上提醒学生明天交作业，小明低头不语，小红悄悄推了推他的背。",
              "characterNames": ["老师", "小明", "小红"],
              "expectedDialogueCount": 1
            }
          ]
        }
      }

  - input: |
      深夜，医院走廊。林医生快步走向急诊室，护士小张紧跟在后："血压在下降！"林医生推开急诊室的门，看到病床上的老人面色苍白。"准备抢救。"林医生冷静地说。
    output: |
      {
        "script": {
          "title": "深夜急诊抢救",
          "characters": [
            {
              "canonicalName": "林医生",
              "roleType": "PROTAGONIST",
              "gender": "未知",
              "description": "急诊医生，冷静指挥抢救",
              "personality": ["冷静"],
              "relationships": []
            },
            {
              "canonicalName": "小张",
              "roleType": "SUPPORTING",
              "gender": "未知",
              "description": "护士，跟随林医生报告病情",
              "personality": ["未知"],
              "relationships": []
            },
            {
              "canonicalName": "老人",
              "roleType": "MINOR",
              "gender": "男",
              "description": "病床上的老年患者，面色苍白",
              "personality": ["未知"],
              "relationships": []
            }
          ],
          "scenes": [
            {
              "sceneNumber": 1,
              "location": "医院走廊",
              "timeOfDay": "NIGHT",
              "interior": true,
              "title": "紧急赶往急诊室",
              "mood": "紧张，急迫",
              "summary": "林医生快步走向急诊室，护士小张紧跟在后报告血压下降。",
              "characterNames": ["林医生", "小张"],
              "expectedDialogueCount": 1
            },
            {
              "sceneNumber": 2,
              "location": "急诊室",
              "timeOfDay": "NIGHT",
              "interior": true,
              "title": "准备抢救病人",
              "mood": "紧张，凝重",
              "summary": "林医生推开急诊室门，看到病床上面色苍白的老人，冷静地说准备抢救。",
              "characterNames": ["林医生", "老人"],
              "expectedDialogueCount": 1
            }
          ]
        }
      }

output_schema:
  type: object
  properties:
    script:
      type: object
      properties:
        title:
          type: string
          description: "剧本标题"
        characters:
          type: array
          items:
            type: object
            properties:
              canonicalName: { type: string }
              roleType: { type: string, enum: [PROTAGONIST, ANTAGONIST, SUPPORTING, MINOR, EXTRAS] }
              gender: { type: string }
              description: { type: string }
              personality: { type: array, items: { type: string } }
              relationships: { type: array }
        scenes:
          type: array
          items:
            type: object
            properties:
              sceneNumber: { type: integer }
              location: { type: string }
              timeOfDay: { type: string, enum: [DAWN, MORNING, AFTERNOON, EVENING, NIGHT, LATE_NIGHT, UNKNOWN] }
              interior: { type: boolean }
              title: { type: string }
              mood: { type: string }
              summary: { type: string }
              characterNames:
                type: array
                items: { type: string }
                description: "此场景中出现的角色名称列表"
              expectedDialogueCount:
                type: integer
                description: "预计此场景中的对白数量（用于后续对白生成步骤）"

validation:
  rules:
    - field: script.title
      rule: notBlank
    - field: script.characters
      rule: notEmpty
    - field: script.scenes
      rule: notEmpty
  retry:
    max_retries: 2
    on_validation_failure: true
