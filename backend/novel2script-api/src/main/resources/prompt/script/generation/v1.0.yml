output_schema:
  type: object
  properties:
    script:
      type: object
      properties:
        title:
          type: string
          description: "剧本标题"
        characters:
          type: array
          items:
            type: object
            properties:
              canonicalName: { type: string }
              roleType: { type: string, enum: [PROTAGONIST, ANTAGONIST, SUPPORTING, EXTRAS] }
              gender: { type: string }
              description: { type: string }
              personality: { type: array, items: { type: string } }
              relationships: { type: array }
        scenes:
          type: array
          items:
            type: object
            properties:
              sceneNumber: { type: integer }
              location: { type: string }
              timeOfDay: { type: string, enum: [DAWN, MORNING, AFTERNOON, EVENING, NIGHT, LATE_NIGHT, UNKNOWN] }
              interior: { type: boolean }
              title: { type: string }
              mood: { type: string }
              dialogues:
                type: array
                items:
                  type: object
                  properties:
                    speaker: { type: string }
                    content: { type: string }
                    emotion: { type: string, enum: [CALM, ANGRY, HAPPY, SAD, SURPRISED, UNKNOWN] }
              actions:
                type: array
                items:
                  type: object
                  properties:
                    actionType: { type: string, enum: [BEAT, ACTION, REACTION, BUSINESS] }
                    description: { type: string }

validation:
  rules:
    - field: script.title
      rule: notBlank
    - field: script.characters
      rule: notEmpty
    - field: script.scenes
      rule: notEmpty
  retry:
    max_retries: 2
    on_validation_failure: true
