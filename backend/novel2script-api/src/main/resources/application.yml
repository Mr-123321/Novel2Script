# =====================================================
# 通用配置文件 - 所有开发者共享
# ⚠️ 不要在此文件中填写敏感信息（密码、API密钥等）
# 个人配置请在 application-dev.yml 中设置
# =====================================================

spring:
  application:
    name: novel2script
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
  # 禁用 Spring AI 的默认 OpenAI 自动配置（我们使用自定义的多模型配置）
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/novel2script?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false
  ai:
    # 默认使用的 AI 提供商（必须在 providers 中配置）
    default-provider: deepseek

    # ── 嵌入模型配置 ──────────────────────────────────────
    embedding:
      model: text-embedding-v1    # Qwen embedding model (1536 dims)
      enabled: true               # set to false to force hash-based fallback

    # ── 多提供商配置 ──────────────────────────────────────
    # 每个提供商独立配置 API key、base-url 和 chat 参数
    # 所有提供商均使用 OpenAI 兼容接口协议
    providers:
      deepseek:
        api-key: ${DEEPSEEK_API_KEY}
        base-url: https://api.deepseek.com
        chat:
          options:
            model: deepseek-chat
            temperature: 0.7
            max-tokens: 4096
            stream: true

      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: https://api.openai.com
        chat:
          options:
            model: gpt-4o
            temperature: 0.7
            max-tokens: 4096
            stream: true

      qwen:
        api-key: ${QWEN_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        chat:
          options:
            model: qwen-max
            temperature: 0.7
            max-tokens: 4096
            stream: true

      claude:
        api-key: ${ANTHROPIC_API_KEY:}
        base-url: https://api.anthropic.com
        chat:
          options:
            model: claude-sonnet-4-6
            temperature: 0.7
            max-tokens: 4096
            stream: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Novel2Script 业务配置
novel2script:
  character:
    resolver:
      # 是否启用 embedding 合并（Layer 2）
      # false = 仅使用规则合并，避免 embedding API 404 错误
      # true  = 使用嵌入向量验证字符合并决策
      use-embedding-merge: false
  prompt:
    cache:
      ttl-minutes: 60
      max-size: 500

# 剧本生成配置
script:
  generation:
    single-pass:
      # 是否启用单次 AI 调用生成完整剧本
      # false = 跳过（直接使用多步流水线），避免浪费 ~90s 等待必然失败的调用
      # true  = 先尝试单次生成，失败后回退多步流水线
      enabled: true
      # 单次生成专用 max_tokens（覆盖 provider 默认的 4096）
      # 16384 tokens 足够 5-10 章的剧本大纲（v2.0 简化输出）
      max-tokens: 16384
      # 单次生成专用 temperature（比默认 0.7 更低，提高 JSON 格式稳定性）
      temperature: 0.3
      # 是否使用分段生成模式（v2.0）：先生成角色+场景大纲，再分段生成对白
      # true  = 使用 v2.0 分段模式（推荐）
      # false = 使用 v1.0 完整 JSON 模式（需要更多 tokens）
      staged: true
      # 章节内容截断长度（字符），用于减少 prompt 大小
      # 0 = 不截断（发送全文）
      chapter-truncate-chars: 2000

server:
  port: 8080

logging:
  level:
    com.novel2script: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.ai: ${LOG_LEVEL_AI:DEBUG}
