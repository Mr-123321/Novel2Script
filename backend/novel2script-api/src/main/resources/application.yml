# =====================================================
# 通用配置文件 - 所有开发者共享
# ⚠️ 不要在此文件中填写敏感信息（密码、API密钥等）
# 个人配置请在 application-dev.yml 中设置
# =====================================================

spring:
  application:
    name: novel2script
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/novel2script?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false
  ai:
    # 默认使用的 AI 提供商（必须在 providers 中配置）
    default-provider: deepseek

    # ── 多提供商配置 ──────────────────────────────────────
    # 每个提供商独立配置 API key、base-url 和 chat 参数
    # 所有提供商均使用 OpenAI 兼容接口协议
    providers:
      deepseek:
        api-key: ${DEEPSEEK_API_KEY}
        base-url: https://api.deepseek.com
        chat:
          options:
            model: deepseek-chat
            temperature: 0.7
            max-tokens: 4096

      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: https://api.openai.com
        chat:
          options:
            model: gpt-4o
            temperature: 0.7
            max-tokens: 4096

      qwen:
        api-key: ${QWEN_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        chat:
          options:
            model: qwen-max
            temperature: 0.7
            max-tokens: 4096

      claude:
        api-key: ${ANTHROPIC_API_KEY:}
        base-url: https://api.anthropic.com
        chat:
          options:
            model: claude-sonnet-4-6
            temperature: 0.7
            max-tokens: 4096

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

logging:
  level:
    com.novel2script: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.ai: ${LOG_LEVEL_AI:DEBUG}
